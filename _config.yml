# Welcome to Jekyll!
#
# Settings that affect the entire site.
# Restart the local server after changing this file.

# Basic Site Settings
locale: "en-US"
site_theme: "default"
title: "Chunyu Zhao"
title_separator: "-"
name: &name "Chunyu Zhao"
description: &description "Remote sensing and Earth observation researcher working on image restoration, super-resolution, multimodal data fusion, and long-term vegetation monitoring."
url: "https://chunyuzhao.com"
baseurl: ""
repository: "Lucaszhao2100/Lucaszhao2100.github.io"

# Site Author
author:
  avatar: "image1.jpg"
  name: "赵春宇 Chunyu Zhao⛷️"
  bio: "Research Assistant at Peking University"
  location: "Beijing, China"
  employer: "Peking University"
  email: "chunyuz.zhao@gmail.com"

  # Academic websites
  googlescholar: "https://scholar.google.com/citations?user=WczTXKEAAAAJ&hl=en"
  orcid: "https://orcid.org/0009-0002-4207-8538"
  researchgate: "https://www.researchgate.net/profile/Chunyu-Zhao-15"

  # Repositories
  github: Lucaszhao2100

# Publication Category
publication_category:
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# Site Settings
teaser:
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false

# Comments
comments:
  provider: false

# RSS
atom_feed:
  hide: true
  path:

# SEO Related
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

# Social sharing metadata
twitter:
  username:

facebook:
  username:
  app_id:
  publisher:

og_image: "pku-hero.jpg"
og_description: *description

social:
  type: "Person"
  name: "Chunyu Zhao"
  links:
    - "https://scholar.google.com/citations?user=WczTXKEAAAAJ"
    - "https://orcid.org/0009-0002-4207-8538"
    - "https://www.researchgate.net/profile/Chunyu-Zhao-15"
    - "https://github.com/Lucaszhao2100"

# Analytics
# Update the privacy notice before enabling data-collecting features.
analytics:
  provider: false

# Reading Files
include:
  - .htaccess
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: false
    permalink: /:collection/:path/

  # Published papers: generate detail pages
  publications:
    output: true
    permalink: /:collection/:path/

  # Unpublished manuscripts: available to Liquid, no detail pages
  manuscripts:
    output: false

  portfolio:
    output: false
    permalink: /:collection/:path/

  talks:
    output: true
    permalink: /:collection/:path/

# Front Matter Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false

  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # _manuscripts
  - scope:
      path: ""
      type: manuscripts
    values:
      sitemap: false

  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comment: false

  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false

  # Talk map
  - scope:
      path: "talkmap"
    values:
      sitemap: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  ignore:
    envs: development
  blanklines: false
